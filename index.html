    <script>
      (function() {
        // 1. Filter out Vite client WebSocket logs
        var origDebug = console.debug;
        console.debug = function() {
          if (arguments[0] && typeof arguments[0] === 'string' && arguments[0].indexOf('[vite]') !== -1) return;
          return origDebug.apply(console, arguments);
        };
        var origError = console.error;
        console.error = function() {
          if (arguments[0] && typeof arguments[0] === 'string' && arguments[0].indexOf('[vite]') !== -1 && arguments[0].indexOf('websocket') !== -1) return;
          return origError.apply(console, arguments);
        };

        // 2. Intercept Vite HMR WebSocket in preview iframe
        var NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          function MockViteWebSocket(url, protocols) {
            var isViteHmr = false;
            if (protocols === 'vite-hmr') isViteHmr = true;
            if (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) isViteHmr = true;
            if (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('24678') !== -1 || url.indexOf('5173') !== -1)) isViteHmr = true;

            if (!isViteHmr) {
              return new NativeWebSocket(url, protocols);
            }

            var target = new EventTarget();
            target.readyState = 1; // WebSocket.OPEN
            target.OPEN = 1;
            target.CONNECTING = 0;
            target.CLOSING = 2;
            target.CLOSED = 3;
            target.url = url;
            target.protocol = 'vite-hmr';
            target.binaryType = 'blob';
            target.bufferedAmount = 0;
            target.extensions = '';
            target.send = function() {};
            target.close = function() { target.readyState = 3; };
            target.onopen = null;
            target.onclose = null;
            target.onerror = null;
            target.onmessage = null;

            setTimeout(function() {
              var openEvt = new Event('open');
              target.dispatchEvent(openEvt);
              if (typeof target.onopen === 'function') target.onopen(openEvt);
            }, 0);

            return target;
          }

          MockViteWebSocket.prototype = NativeWebSocket.prototype;
          MockViteWebSocket.CONNECTING = 0;
          MockViteWebSocket.OPEN = 1;
          MockViteWebSocket.CLOSING = 2;
          MockViteWebSocket.CLOSED = 3;

          window.WebSocket = MockViteWebSocket;
        }

        // 3. Prevent unhandled rejections from WebSocket closures
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var msg = reason ? (reason.message || String(reason)) : '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1) {
            event.preventDefault();
          }
        });
      })();
    </script>
